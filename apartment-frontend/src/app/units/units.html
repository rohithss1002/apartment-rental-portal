<p>units works!</p>
<div class="page-container">

  <h1 class="page-title">Browse Available Units</h1>

  <div *ngIf="units.length === 0" class="empty-message">
    No units available right now.
  </div>

  <div class="units-grid">

    <div *ngFor="let unit of units" class="unit-card">

      <div class="image-wrapper">
        <img 
          [src]="unit.image_url || 'https://via.placeholder.com/400x250?text=No+Image'" 
          alt="Unit Image">
      </div>

      <div class="unit-info">
        <h3>{{ unit.tower_name }} - {{ unit.unit_number }}</h3>

        <p class="bhk">{{ unit.bhk_type }}</p>

        <p class="rent">₹ {{ unit.rent | number }}</p>

        <span 
          class="status" 
          [ngClass]="{
            'available': unit.status === 'AVAILABLE',
            'booked': unit.status !== 'AVAILABLE'
          }">
          {{ unit.status }}
        </span>

        <button 
          *ngIf="unit.status === 'AVAILABLE'" 
          class="book-btn"
          (click)="book(unit.id)">
          Book Now
        </button>

      </div>

    </div>

  </div>

</div>
